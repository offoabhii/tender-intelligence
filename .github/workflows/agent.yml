name: Tender Agent Auto-Run

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: tender-agent-scan
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify repository structure
        run: |
          echo "=== Root files ==="
          ls -la

          echo "=== App files ==="
          ls -la app

          test -f app/__init__.py
          test -f app/config.py
          test -f app/schema.py
          test -f app/auditor.py
          test -f app/agent_runner.py
          test -f app/scraper.py
          test -f app/db.py
          test -f run_agent.py

      - name: Verify Python imports
        env:
          PYTHONPATH: .
        run: |
          python -m compileall app run_agent.py
          python -c "from app.config import CATEGORY_KEYWORDS; print('config import OK')"
          python -c "from app.auditor import IntelligentAuditor; print('auditor import OK')"
          python -c "from app.agent_runner import run_pipeline; print('pipeline import OK')"

      - name: Create data directory
        run: mkdir -p data

      - name: Run real tender pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: sqlite:///./data/tenders.db
          PYTHONPATH: .
        run: |
          echo "=== Running real tender pipeline ==="
          python run_agent.py

          echo "=== Generated files ==="
          ls -lah data

          echo "=== Health ==="
          cat data/health.json

          echo "=== Live data ==="
          cat data/live_tenders.json

      - name: Commit real pipeline output
        if: always()
        run: |
          git config user.name "Tender Intelligence Bot"
          git config user.email "tender-intelligence-bot@users.noreply.github.com"

          git add -f data/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: update live tender scan"
            git push origin main
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tender-agent-output-${{ github.run_id }}
          path: data/
          if-no-files-found: warn
          retention-days: 14